version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 2
    groups:
      python-runtime: {patterns: ["*"]}
    # Airflow constraints/provider upgrades require one reviewed compatibility change.
    ignore:
      - dependency-name: apache-airflow
      - dependency-name: apache-airflow-providers-*
