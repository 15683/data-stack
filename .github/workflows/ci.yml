name: Test and publish images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            docker/constraints-3.3.2-python3.12.txt
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.22.0
      - run: pip install -r requirements-dev.txt
      - run: make lint test
      - run: bash scripts/integration.sh
      - run: python scripts/check_statsd.py
      - run: shellcheck scripts/*.sh deploy/chart/files/*.sh
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7
      - run: bash scripts/validate-manifests.sh

  images:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [airflow, consumer]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Build and load for validation
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          load: true
          # Refresh consumer OS fixes even when the pinned base tag has not changed.
          no-cache: ${{ matrix.component == 'consumer' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Import real Airflow DAG
        if: matrix.component == 'airflow'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: |
          docker run --rm --entrypoint airflow \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:test@localhost/airflow \
            "$IMAGE" version
          docker run --rm --entrypoint python \
            -v "$PWD/scripts/check-dag.py:/tmp/check-dag.py:ro" "$IMAGE" /tmp/check-dag.py
      - name: Check installed dependencies
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: docker run --rm --entrypoint python "$IMAGE" -m pip check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.component == 'airflow'
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        if: matrix.component == 'airflow'
        with:
          version: v3.22.0
      - name: Start Airflow API with PostgreSQL and authenticate
        if: matrix.component == 'airflow'
        env:
          AIRFLOW_IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: |
          pip install PyYAML==6.0.3
          python scripts/check_airflow.py
      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: docker push "$IMAGE"
