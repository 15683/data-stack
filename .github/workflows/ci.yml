name: Test and publish images
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            docker/constraints-3.3.2-python3.12.txt
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.22.0
      - run: pip install -r requirements-dev.txt
      - run: make lint test
      - run: bash scripts/integration.sh
      - run: python scripts/check_statsd.py
      - run: shellcheck scripts/*.sh deploy/chart/files/*.sh
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7
      - run: bash scripts/validate-manifests.sh

  images:
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [airflow, consumer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
          COMPONENT: ${{ matrix.component }}
        run: echo "image=ghcr.io/${REPOSITORY,,}-${COMPONENT}" >> "$GITHUB_OUTPUT"
      - name: Build and load for validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/${{ matrix.component }}.Dockerfile
          load: true
          # Refresh consumer OS fixes even when the pinned base tag has not changed.
          no-cache: ${{ matrix.component == 'consumer' }}
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Import real Airflow DAG
        if: matrix.component == 'airflow'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: |
          docker run --rm --entrypoint airflow \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:test@localhost/airflow \
            "$IMAGE" version
          docker run --rm --entrypoint python \
            -v "$PWD/scripts/check-dag.py:/tmp/check-dag.py:ro" "$IMAGE" /tmp/check-dag.py
      - name: Check installed dependencies
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: docker run --rm --entrypoint python "$IMAGE" -m pip check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.component == 'airflow'
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        if: matrix.component == 'airflow'
        with:
          version: v3.22.0
      - name: Start Airflow API with PostgreSQL and authenticate
        if: matrix.component == 'airflow'
        env:
          AIRFLOW_IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: |
          pip install PyYAML==6.0.3
          python scripts/check_airflow.py
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.name.outputs.image }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish validated image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: docker push "$IMAGE"
