{{- define "stack.garageConfig" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
data:
  garage.toml: |
    metadata_dir = "/data/meta"
    data_dir = "/data/objects"
    db_engine = "lmdb"
    replication_factor = 1
    block_ram_buffer_max = "32MiB"
    rpc_bind_addr = "[::]:3901"
    rpc_public_addr = "garage-0.garage:3901"
    [s3_api]
    api_bind_addr = "[::]:3900"
    s3_region = "garage"
    [admin]
    api_bind_addr = "[::]:3903"
    metrics_require_token = true
{{- end }}
{{ include "stack.garageConfig" . }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: garage
spec:
  serviceName: garage
  replicas: 1
  selector:
    matchLabels: {app: garage}
  template:
    metadata:
      labels: {app: garage}
      annotations:
        checksum/config: {{ include "stack.garageConfig" . | sha256sum | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: garage
          image: {{ .Values.images.garage }}
          env:
            - name: GARAGE_RPC_SECRET
              valueFrom:
                secretKeyRef: {name: stack-secrets, key: GARAGE_RPC_SECRET}
            - name: GARAGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef: {name: stack-secrets, key: GARAGE_METRICS_TOKEN}
          resources:
            {{- toYaml .Values.garage.resources | nindent 12 }}
          ports:
            - {name: s3, containerPort: 3900}
            - {name: admin, containerPort: 3903}
          readinessProbe:
            httpGet: {path: /health, port: admin}
          livenessProbe:
            tcpSocket: {port: admin}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: config, mountPath: /etc/garage.toml, subPath: garage.toml, readOnly: true}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: garage-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: {{ .Values.garage.storage }}}
