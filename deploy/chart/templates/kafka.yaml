apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000}
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: {{ .Values.images.kafka }}
          env:
            - name: CLUSTER_ID
              valueFrom:
                secretKeyRef: {name: stack-secrets, key: KAFKA_CLUSTER_ID}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka:9093"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka:9092"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS, value: "1"}
            - {name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0"}
            - {name: KAFKA_NUM_PARTITIONS, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
            - {name: KAFKA_LOG_RETENTION_HOURS, value: {{ .Values.kafka.retentionHours | quote }}}
            - {name: KAFKA_LOG_RETENTION_BYTES, value: {{ .Values.kafka.retentionBytes | int64 | quote }}}
            - {name: KAFKA_LOG_SEGMENT_BYTES, value: "67108864"}
            - {name: KAFKA_NUM_NETWORK_THREADS, value: "2"}
            - {name: KAFKA_NUM_IO_THREADS, value: "2"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx384m"}
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          ports: [{name: kafka, containerPort: 9092}]
          startupProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: kafka}
          livenessProbe:
            tcpSocket: {port: kafka}
            periodSeconds: 30
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests: {storage: {{ .Values.kafka.storage }}}
