[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "football-data-stack"
version = "0.3.0"
requires-python = ">=3.12,<3.13"
description = "Small, replayable football pipeline for a single-node k3s lab"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs isolated PostgreSQL, Garage and Kafka"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/measure.py" = ["UP017"]  # Runs on Ubuntu 22.04 host Python 3.10.
